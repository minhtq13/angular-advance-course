name: care

# Mặc định (học viên chỉ cần lệnh này):   docker compose -f infra/docker-compose.yml up -d
#   -> postgres (có sẵn dữ liệu) + api :8081 + adminer :8088
# Thêm Redis cache (tùy chọn):             docker compose -f infra/docker-compose.yml --profile cache up -d
# Thêm Keycloak cho buổi 7 (tùy chọn):     docker compose -f infra/docker-compose.yml --profile sso up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: care
      POSTGRES_USER: care
      POSTGRES_PASSWORD: care
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Lần đầu tạo volume: tự động restore dump (200k thuê bao, 50k phiếu, tài khoản mẫu).
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Kiểm tra qua TCP: trong lúc restore dump, Postgres chưa mở TCP -> api sẽ đợi đến khi xong.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U care -d care"]
      interval: 3s
      retries: 40

  api:
    build: ../backend
    image: care-api:dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Buổi 3: DEMO_SLOW_SHORT_QUERY=true docker compose -f infra/docker-compose.yml up -d api
      DEMO_SLOW_SHORT_QUERY: ${DEMO_SLOW_SHORT_QUERY:-false}
      # Buổi 5: MAX_PAGE_SIZE=10000 docker compose -f infra/docker-compose.yml up -d api
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-200}
      # Buổi 6: ACCESS_TOKEN_TTL=30s docker compose -f infra/docker-compose.yml up -d api  (tái hiện token hết hạn trong lớp)
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-8h}
      # Buổi 7: ngoài token tự phát, API nhận thêm access token của Keycloak (profile sso).
      # iss phải khớp URL trình duyệt thấy (localhost:8180); key công khai (JWKS) lấy qua mạng nội bộ docker.
      SSO_ISSUER_URI: ${SSO_ISSUER_URI:-http://localhost:8180/realms/care}
      SSO_JWK_SET_URI: ${SSO_JWK_SET_URI:-http://keycloak:8180/realms/care/protocol/openid-connect/certs}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 5s
      retries: 30

  # Xem/truy vấn DB trên trình duyệt: http://localhost:8088
  adminer:
    image: adminer:5
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8088:8080"
    depends_on:
      - postgres

  # Buổi 7: máy chủ định danh OIDC. Admin console http://localhost:8180/admin (admin/admin).
  # Realm "care" import từ infra/keycloak/care-realm.json mỗi lần tạo container (không có volume: xóa container là về ban đầu).
  keycloak:
    profiles: ["sso"]
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Cố định issuer = URL trình duyệt dùng; api gọi JWKS qua http://keycloak:8180 vẫn được.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8180:8180"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  redis:
    profiles: ["cache"]
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
