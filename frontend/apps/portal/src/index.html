<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Care Portal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Đặt theme TRƯỚC khi Angular chạy -> không nháy nền trang khi mở app ở chế độ tối.
      // CSS dark của ng-zorro được ThemeService gắn sau stylesheet chính (thứ tự quyết định ghi đè).
      (function () {
        try {
          var p = localStorage.getItem('care.theme');
          var dark =
            p === 'dark' ||
            (p !== 'light' &&
              matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <care-root></care-root>
  </body>
</html>
