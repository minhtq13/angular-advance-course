<!-- Chưa đăng nhập: chỉ hiện trang /login, không có khung menu. -->
@if (auth.isAuthenticated()) {
<care-shell
  [appName]="appName"
  [navItems]="navItems"
  [userName]="auth.displayName()"
  [roles]="auth.roleLabelKeys()"
  [environmentName]="config.environmentName"
  (logout)="auth.logout()"
>
  <router-outlet />
</care-shell>
} @else {
<router-outlet />
}
