# Buổi 1: kiểm tra luật phụ thuộc (ESLint module boundaries) mỗi lần push/PR.
# Buổi 9 mở rộng thành pipeline đầy đủ (test, build, budget, Docker).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx nx run-many -t lint
