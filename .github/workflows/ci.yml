# Buổi 1: kiểm tra luật phụ thuộc (ESLint module boundaries) mỗi lần push/PR.
# Buổi 9: pipeline đầy đủ.
#   PR:             gate trên các project bị ảnh hưởng (nx affected) -> nhanh.
#   main, tag v*:   gate đủ -> image có version -> triển khai thử -> smoke test trên CHÍNH image đó -> lưu image làm artifact.
# Budget nằm trong target build (apps/portal/project.json): vượt maximumError là build đỏ, không cần bước riêng.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Push mới lên cùng nhánh thì hủy lần chạy cũ.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # nx affected so với nhánh đích -> cần lịch sử git.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # engine-strict (.npmrc): sai Node thì dừng ở đây, không chờ đến lỗi build khó hiểu.
      - run: npm ci
      - name: Lint, test, build (gồm budget)
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            npx nx affected -t lint test build --base=origin/${{ github.base_ref }} --head=HEAD
          else
            npx nx run-many -t lint test build
          fi

  image:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        # tag v1.1.0 -> 1.1.0; main -> 0.0.0-main.<commit>. Một version = một image, không build lại khi lên môi trường khác.
        run: |
          SHORT=${GITHUB_SHA::7}
          if [ "$GITHUB_REF_TYPE" = tag ]; then V=${GITHUB_REF_NAME#v}; else V=0.0.0-main.$SHORT; fi
          echo "WEB_VERSION=$V" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=$SHORT" >> "$GITHUB_ENV"
      - name: Build image
        run: docker compose -f infra/docker-compose.yml --profile web build web
      - name: Triển khai thử (postgres + api + web)
        run: docker compose -f infra/docker-compose.yml --profile web up -d --wait web
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Smoke test
        working-directory: frontend
        env:
          BASE_URL: http://localhost:8090
          EXPECTED_VERSION: ${{ env.WEB_VERSION }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c apps/portal-e2e/playwright.smoke.config.mts
      - name: Log container khi smoke đỏ
        if: failure()
        run: docker compose -f infra/docker-compose.yml --profile web logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ env.WEB_VERSION }}
          path: frontend/dist/smoke-report
      # Artifact có version để rollback: tải về rồi docker load. Dự án thật đẩy lên registry (GHCR, Harbor, Nexus).
      - name: Lưu image
        run: docker save care-portal-web:$WEB_VERSION | gzip > care-portal-web-$WEB_VERSION.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: care-portal-web-${{ env.WEB_VERSION }}
          path: care-portal-web-*.tar.gz
          retention-days: 30
