spring:
  application:
    name: care-api
  messages:
    basename: messages
    encoding: UTF-8
    # Khong roi ve locale cua may chu: request khong ho tro -> messages.properties (tieng Viet).
    fallback-to-system-locale: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:care}
    username: ${DB_USER:care}
    password: ${DB_PASSWORD:care}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    placeholders:
      # So thue bao seed san. Buoi 3 tang len 1_000_000 - 5_000_000 de demo du lieu lon.
      seed_subscribers: ${SEED_SUBSCRIBERS:200000}
      seed_tickets: ${SEED_TICKETS:50000}
  data:
    web:
      pageable:
        max-page-size: 200
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    # simple = cache trong bo nho (mac dinh). Dat CACHE_TYPE=redis khi chay kem Redis.
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 10m

care:
  auth:
    # Chi dung cho moi truong dev/hoc. Production phai truyen qua bien moi truong / secret manager.
    jwt-secret: ${JWT_SECRET:care-dev-secret-change-me-in-production-0123456789}
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:8h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4300}

server:
  port: ${PORT:8081}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
