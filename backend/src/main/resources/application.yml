spring:
  application:
    name: care-api
  messages:
    basename: messages
    encoding: UTF-8
    # Không rơi về locale của máy chủ: request không hỗ trợ -> messages.properties (tiếng Việt).
    fallback-to-system-locale: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:care}
    username: ${DB_USER:care}
    password: ${DB_PASSWORD:care}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.batch_size: 50
        default_batch_fetch_size: 50
  flyway:
    placeholders:
      # Số thuê bao seed sẵn. Buổi 5 tăng lên 1_000_000 - 5_000_000 để demo dữ liệu lớn.
      seed_subscribers: ${SEED_SUBSCRIBERS:200000}
      seed_tickets: ${SEED_TICKETS:50000}
  data:
    web:
      pageable:
        # Buổi 5: MAX_PAGE_SIZE=10000 để tải nhiều dòng khi đo hiệu năng. Mặc định giới hạn 200 để bảo vệ server.
        max-page-size: ${MAX_PAGE_SIZE:200}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    # simple = cache trong bộ nhớ (mặc định). Đặt CACHE_TYPE=redis khi chạy kèm Redis.
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 10m

care:
  auth:
    # Chỉ dùng cho môi trường dev/học. Production phải truyền qua biến môi trường / secret manager.
    jwt-secret: ${JWT_SECRET:care-dev-secret-change-me-in-production-0123456789}
    # Buổi 6: ACCESS_TOKEN_TTL=30s để thấy access token hết hạn và refresh trong lớp.
    access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:8h}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4300}
  demo:
    # Buổi 3: từ khóa tìm thuê bao ngắn hơn 5 ký tự trả về chậm 2 giây. Chỉ bật khi demo trong lớp.
    slow-short-query: ${DEMO_SLOW_SHORT_QUERY:false}

server:
  port: ${PORT:8081}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
